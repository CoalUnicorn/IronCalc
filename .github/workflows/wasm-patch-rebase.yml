name: rebase wasm-zip patch onto upstream main

# Keeps CoalUnicorn/IronCalc:rustycalc-xlsx-wasm equal to
# ironcalc/IronCalc:main + the single wasm-zip-features commit.
# Verifies wasm32 still compiles before force-pushing the rebased branch.
# Replaces the daily drift-detection cron in CoalUnicorn/RustyCalc.

on:
  schedule:
    - cron: "0 5 * * *"     # 05:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write           # force-push to rustycalc-xlsx-wasm
  issues: write             # open report when rebase or verify fails

env:
  CARGO_TERM_COLOR: always

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rustycalc-xlsx-wasm
        uses: actions/checkout@v6
        with:
          ref: rustycalc-xlsx-wasm
          fetch-depth: 0    # rebase needs full history

      - name: Install Rust toolchain (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Configure git identity
        run: |
          git config user.name  "rebase-bot"
          git config user.email "rebase-bot@users.noreply.github.com"

      - name: Fetch upstream/main
        run: |
          git remote add upstream https://github.com/ironcalc/IronCalc.git
          git fetch upstream main

      - name: Rebase onto upstream/main
        id: rebase
        continue-on-error: true
        run: git rebase upstream/main

      - name: Verify ironcalc compiles for wasm32
        if: steps.rebase.outcome == 'success'
        id: verify
        continue-on-error: true
        run: cargo check -p ironcalc --target wasm32-unknown-unknown

      - name: Push rebased branch (force-with-lease)
        if: steps.rebase.outcome == 'success' && steps.verify.outcome == 'success'
        run: git push --force-with-lease origin rustycalc-xlsx-wasm

      - name: Open issue on rebase conflict
        if: steps.rebase.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "wasm-zip patch rebase failed against upstream/main",
              body: `Auto-rebase of \`rustycalc-xlsx-wasm\` onto \`upstream/main\` hit a conflict. Manual fix needed.\n\nRun: ${url}`
            });

      - name: Open issue on wasm32 verify failure
        if: steps.rebase.outcome == 'success' && steps.verify.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "wasm-zip patch rebased clean but wasm32 build broke",
              body: `Rebase onto \`upstream/main\` applied cleanly, but \`cargo check -p ironcalc --target wasm32-unknown-unknown\` failed. Upstream likely introduced another wasm-incompatible dep.\n\nRun: ${url}`
            });
